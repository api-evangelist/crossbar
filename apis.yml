name: Crossbar
description: 'Crossbar, Inc. is a Santa Clara semiconductor company founded in 2010 that develops resistive
  random-access memory (ReRAM), a non-volatile memory built on RRAM patents licensed from the University
  of Michigan. Its CMOS-compatible ReRAM targets faster write performance, lower power consumption, and
  higher endurance than NAND flash at roughly half the die size, and is offered as embedded and standalone
  memory IP to OEMs and system-on-chip developers across consumer, mobile, enterprise, industrial, and
  IoT markets. Crossbar is a hardtech portfolio company backed by Kleiner Perkins. As a silicon-IP provider
  it exposes no public developer API surface; this profile carries company identity and domain-security
  posture only.'
